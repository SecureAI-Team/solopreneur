
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream definitions
    upstream nextjs_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:3001;
    }

    # HTTP server (Redirect to HTTPS)
    server {
        listen 80;
        server_name solomedia.cc api.solomedia.cc;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Web
    server {
        listen 443 ssl http2;
        server_name solomedia.cc;

        # SSL Certificates (Volume mapped from Certbot)
        # ssl_certificate /etc/letsencrypt/live/solomedia.cc/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/solomedia.cc/privkey.pem;

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # HTTPS Server - API
    server {
        listen 443 ssl http2;
        server_name api.solomedia.cc;

        # SSL Certificates
        # ssl_certificate /etc/letsencrypt/live/solomedia.cc/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/solomedia.cc/privkey.pem;

        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
